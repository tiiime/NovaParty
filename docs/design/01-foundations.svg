<text x="598" y="545" font-size="22" font-weight="600" fill="#133464" text-anchor="start">糖果粉</text>
<text x="598" y="579" font-size="20" font-weight="400" fill="#506786" text-anchor="start">#FF75B9</text>
<rect x="766" y="387" width="143" height="118" rx="27" fill="#49DFCB"/>
<text x="766" y="545" font-size="22" font-weight="600" fill="#133464" text-anchor="start">薄荷青</text>
<text x="766" y="579" font-size="20" font-weight="400" fill="#506786" text-anchor="start">#49DFCB</text>
<rect x="934" y="387" width="143" height="118" rx="27" fill="#133464"/>
<text x="934" y="545" font-size="22" font-weight="600" fill="#133464" text-anchor="start">深海字</text>
<text x="934" y="579" font-size="20" font-weight="400" fill="#506786" text-anchor="start">#133464</text>
<text x="94" y="637" font-size="22" font-weight="400" fill="#506786" text-anchor="start">蓝色承载空间；黄色锁定主操作；粉 / 青仅做小面积庆祝点缀。</text>
<rect x="1144" y="287" width="712" height="420" rx="32" fill="#D6E3FB"/>
<rect x="1144" y="280" width="712" height="420" rx="32" fill="white"/>
<rect x="1170" y="305" width="47" height="37" rx="12" fill="#2058E0"/>
<text x="1193" y="331" font-size="19" font-weight="700" fill="white" text-anchor="middle">02</text>
<text x="1233" y="333" font-size="25" font-weight="700" fill="#133464" text-anchor="start">星星像一个充气玩具</text>
<g transform="translate(1190 383) scale(1.45) rotate(-8 55 55)">
<use href="#star-shape" transform="translate(0 4)" fill="#C98A14"/>
