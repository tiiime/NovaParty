<text x="1690" y="592" font-size="23" font-weight="600" fill="#133464" text-anchor="middle">庆祝</text>
<text x="1176" y="648" font-size="21" font-weight="400" fill="#506786" text-anchor="start">柔和体积 / 顶部高光 / 表情简单 / 轮廓清楚</text>
<rect x="64" y="741" width="600" height="510" rx="32" fill="#D6E3FB"/>
<rect x="64" y="734" width="600" height="510" rx="32" fill="white"/>
<rect x="90" y="759" width="47" height="37" rx="12" fill="#2058E0"/>
<text x="113" y="785" font-size="19" font-weight="700" fill="white" text-anchor="middle">03</text>
<text x="153" y="787" font-size="25" font-weight="700" fill="#133464" text-anchor="start">材质与形状</text>
<rect x="99" y="858" width="530" height="90" rx="45.0" fill="#C58A0F"/>
<rect x="99" y="850" width="530" height="90" rx="45.0" fill="url(#gold)" stroke="#FFFFFF" stroke-width="3"/>
<path d="M134 859H594" stroke="white" stroke-width="3" stroke-linecap="round" opacity=".65"/>
<text x="364.0" y="904.36" font-size="26" font-weight="700" fill="#133464" text-anchor="middle">开始游戏</text>
<text x="99" y="1000" font-size="22" font-weight="400" fill="#506786" text-anchor="start">胶囊外形 + 8 单位下沿，按压下沉 4。</text>
<text x="99" y="1047" font-size="22" font-weight="400" fill="#506786" text-anchor="start">高光是一小段亮边，不铺满反光纹理。</text>
<text x="99" y="1094" font-size="22" font-weight="400" fill="#506786" text-anchor="start">卡片 R28；面板 R32；按钮大圆角。</text>
<text x="99" y="1141" font-size="22" font-weight="400" fill="#506786" text-anchor="start">白色表面配冷蓝底边，形成轻盈厚度。</text>
<rect x="688" y="741" width="600" height="510" rx="32" fill="#D6E3FB"/>
<rect x="688" y="734" width="600" height="510" rx="32" fill="white"/>
<rect x="714" y="759" width="47" height="37" rx="12" fill="#2058E0"/>
<text x="737" y="785" font-size="19" font-weight="700" fill="white" text-anchor="middle">04</text>
<text x="777" y="787" font-size="25" font-weight="700" fill="#133464" text-anchor="start">文字与空间</text>
<text x="722" y="866" font-size="35" font-weight="700" fill="#133464" text-anchor="start">今晚，一起开局！</text>
<text x="722" y="920" font-size="25" font-weight="400" fill="#133464" text-anchor="start">只看一眼，就知道该点哪里。</text>
<text x="722" y="1000" font-size="22" font-weight="400" fill="#506786" text-anchor="start">沿用 Noto Sans SC，标题 600–700。</text>
<text x="722" y="1047" font-size="22" font-weight="400" fill="#506786" text-anchor="start">手机正文 17 / 26；电视 24 / 34。</text>
<text x="722" y="1094" font-size="22" font-weight="400" fill="#506786" text-anchor="start">间距 8 / 12 / 16 / 24 / 32 / 48。</text>
<text x="722" y="1141" font-size="22" font-weight="400" fill="#506786" text-anchor="start">白字放稳定蓝底；小字不压在彩带上。</text>
<rect x="1312" y="741" width="544" height="510" rx="32" fill="#D6E3FB"/>
<rect x="1312" y="734" width="544" height="510" rx="32" fill="white"/>
<rect x="1338" y="759" width="47" height="37" rx="12" fill="#2058E0"/>
<text x="1361" y="785" font-size="19" font-weight="700" fill="white" text-anchor="middle">05</text>
<text x="1401" y="787" font-size="25" font-weight="700" fill="#133464" text-anchor="start">天空轻变，喜庆不靠闪烁</text>
<rect x="1344" y="852" width="104" height="87" rx="24" fill="#234BE0"/>
<text x="1396" y="908" font-size="26" font-weight="600" fill="white" text-anchor="middle">晨</text>
<rect x="1467" y="852" width="104" height="87" rx="24" fill="#183CD4"/>
<text x="1519" y="908" font-size="26" font-weight="600" fill="white" text-anchor="middle">日</text>
<rect x="1590" y="852" width="104" height="87" rx="24" fill="#393FD2"/>
<text x="1642" y="908" font-size="26" font-weight="600" fill="white" text-anchor="middle">暮</text>
<rect x="1713" y="852" width="104" height="87" rx="24" fill="#2639BD"/>
<text x="1765" y="908" font-size="26" font-weight="600" fill="white" text-anchor="middle">夜</text>
<text x="1344" y="1000" font-size="21" font-weight="400" fill="#506786" text-anchor="start">按当地时间微调天空，控件颜色稳定。</text>
<text x="1344" y="1047" font-size="21" font-weight="400" fill="#506786" text-anchor="start">装饰静置在周边；不持续飞舞。</text>
<text x="1344" y="1094" font-size="21" font-weight="400" fill="#506786" text-anchor="start">开房成功 / 朋友到齐 / 胜利时小爆发。</text>
<text x="1344" y="1141" font-size="21" font-weight="400" fill="#506786" text-anchor="start">减少动态效果时切换为静态星光。</text>
<rect x="64" y="1282" width="1792" height="68" rx="24" fill="#DCE9FF"/>
<text x="94" y="1326" font-size="22" font-weight="500" fill="#133464" text-anchor="start">参考 Astro Bot 官方主视觉 / 预告里的玩具感与蓝白层次；角色、图形和布局为星星大作战重新设计。</text>
<text x="64" y="1403" font-size="18" font-weight="400" fill="#506786" text-anchor="start">星星大作战 · v0.3 星际派对 · SVG 设计提案 / 尚未应用到客户端</text>
<text x="1856" y="1403" font-size="18" font-weight="500" fill="#506786" text-anchor="end">FOUNDATIONS</text></g></svg>
