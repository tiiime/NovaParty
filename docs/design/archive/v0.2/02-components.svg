<text x="92" y="1051" font-size="26" font-weight="700" fill="#173653">10  反馈时机建议</text>
<path d="M92 1072H1116" stroke="#CBDDE9" stroke-width="2"/>
<text x="92" y="1110" font-size="22" font-weight="400" fill="#4D6A80">按下：立即改变按钮状态；松开后进入进行中或完成状态。</text>
<text x="92" y="1153" font-size="22" font-weight="400" fill="#4D6A80">网络操作：先显示“正在…”；收到确认后再展示成功。</text>
<text x="92" y="1196" font-size="22" font-weight="400" fill="#4D6A80">按压 100–140ms；焦点 / 面板 180–240ms，避免循环跳动。</text>
<text x="92" y="1239" font-size="22" font-weight="400" fill="#4D6A80">错误：保留用户输入；长时间等待时提供取消或明确离开入口。</text>
