<text text-anchor="middle" x="1509.5" y="401.0" font-size="23" font-weight="600" fill="#173653">开始游戏</text>
<rect x="1247" y="475" width="525" height="82" rx="18" fill="#ADC5D5"/>
<rect x="1247" y="471" width="525" height="82" rx="18" fill="#FFFFFF" stroke="#CBDDE9" stroke-width="2"/>
<text text-anchor="middle" x="1509.5" y="520.0" font-size="23" font-weight="600" fill="#173653">加入游戏</text>
<text x="992" y="670" font-size="23" font-weight="400" fill="#173653">小星</text>
<text x="1528" y="670" font-size="21" font-weight="400" fill="#4D6A80">方向键选择 · 确认进入</text>
<text x="950" y="788" font-size="24" font-weight="600" fill="#173653">电视大厅 · 大目标、清楚焦点、少量信息</text>
<text x="950" y="836" font-size="21" font-weight="400" fill="#4D6A80">按 1280 × 720 逻辑画布布局，文字与按钮按电视档位放大。</text>
<text x="950" y="874" font-size="21" font-weight="400" fill="#4D6A80">外围建议保留 48 安全边距；手机遵循刘海和手势条区域。</text>
<text x="950" y="912" font-size="21" font-weight="400" fill="#4D6A80">不依靠悬停提供操作；遥控器返回优先关闭当前层。</text>
<rect x="64" y="1100" width="928" height="231" rx="28" fill="#FFFFFF"/>
<text x="92" y="1145" font-size="26" font-weight="700" fill="#173653">12  确认的大厅流程</text>
<path d="M92 1166H964" stroke="#CBDDE9" stroke-width="2"/>
<text x="94" y="1204" font-size="22" font-weight="600" fill="#173653">开始游戏  →  创建房间 / 选择游戏  →  等待朋友</text>
<text x="94" y="1254" font-size="22" font-weight="600" fill="#173653">加入游戏  →  搜索可加入房间  →  加入并等待确认</text>
<rect x="1016" y="961" width="840" height="370" rx="28" fill="#FFFFFF"/>
<text x="1044" y="1006" font-size="26" font-weight="700" fill="#173653">13  平台与 Mod 分工</text>
<path d="M1044 1027H1828" stroke="#CBDDE9" stroke-width="2"/>
<text x="1046" y="1068" font-size="21" font-weight="400" fill="#4D6A80">平台统一：大厅、房间流程、设置、连接提示与返回行为。</text>
<text x="1046" y="1115" font-size="21" font-weight="400" fill="#4D6A80">游戏自由：棋盘、棋子、牌面、背景和游戏内视觉风格。</text>
<text x="1046" y="1162" font-size="21" font-weight="400" fill="#4D6A80">共同底线：清楚的回合、输入反馈、可读文字和电视焦点。</text>
<text x="1046" y="1209" font-size="21" font-weight="400" fill="#4D6A80">状态提示应留有位置，避免遮住棋盘和正在操作的手牌。</text>
<text x="1046" y="1256" font-size="21" font-weight="400" fill="#4D6A80">创建房间内的步骤排列与具体游戏页，留待下一版细化。</text>
<text x="64" y="1401" font-size="17" font-weight="400" fill="#4D6A80">星星大作战 · UI CHEAT SHEET v0.2 · 2026.11.01 · 设计初稿</text>
<text x="1550" y="1401" font-size="17" font-weight="400" fill="#4D6A80">03 / LAYOUTS &amp; FLOWS</text>
