<text x="244" y="160" font-size="27" font-weight="400" fill="#4D6A80">和朋友，亮起一场好游戏。</text>
<rect x="1400" y="145" width="455" height="47" rx="23" fill="#FFF1C7"/>
<text x="1420" y="176" font-size="18" font-weight="550" fill="#173653">v0.2 · 方向已确认 / 组件数值待实测</text>
<text x="64" y="235" font-size="30" font-weight="600" fill="#173653">软萌轻快  /  信息精简  /  状态明确  /  手机 × 电视</text>
<rect x="64" y="278" width="1152" height="420" rx="28" fill="#FFFFFF"/>
<text x="92" y="323" font-size="26" font-weight="700" fill="#173653">01  语义色板</text>
