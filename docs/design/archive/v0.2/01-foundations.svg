<text x="151" y="640" font-size="17" font-weight="400" fill="#4D6A80">同时提供文字，不只依靠颜色</text>
<rect x="616" y="580" width="570" height="78" rx="16" fill="#FFF0F1"/>
<use href="#close" transform="translate(635 603) scale(1)" color="#AE4250"/>
<text x="675" y="612" font-size="20" font-weight="600" fill="#AE4250">错误  #AE4250</text>
<text x="675" y="640" font-size="17" font-weight="400" fill="#4D6A80">说明发生了什么，并提供下一步</text>
