<path d="m36 44 8 6-8 6m36-12-8 6 8 6" fill="none" stroke="#173653" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 62q8 17 16 0Z" fill="#173653"/>
<ellipse cx="32" cy="59" rx="6" ry="3" fill="#F3A873" opacity=".65"/><ellipse cx="78" cy="59" rx="6" ry="3" fill="#F3A873" opacity=".65"/></g>
<text x="1678" y="548" font-size="22" font-weight="600" fill="#173653">庆祝</text>
<text x="1270" y="600" font-size="20" font-weight="400" fill="#4D6A80">亮黄星形、细深蓝描边、简单开心表情。</text>
<text x="1270" y="632" font-size="20" font-weight="400" fill="#4D6A80">角色不承载唯一状态；旁边始终有文字。</text>
<rect x="64" y="722" width="700" height="438" rx="28" fill="#FFFFFF"/>
<text x="92" y="767" font-size="26" font-weight="700" fill="#173653">03  字体与阅读层级</text>
<path d="M92 788H736" stroke="#CBDDE9" stroke-width="2"/>
<text x="92" y="835" font-size="38" font-weight="700" fill="#173653">星星大作战</text>
<text x="92" y="872" font-size="19" font-weight="400" fill="#4D6A80">页面标题  28 / 36 · SemiBold</text>
<text x="92" y="920" font-size="27" font-weight="600" fill="#173653">选择今晚想玩的游戏</text>
<text x="92" y="951" font-size="19" font-weight="400" fill="#4D6A80">分组标题  22 / 30 · Medium</text>
<text x="92" y="994" font-size="23" font-weight="400" fill="#173653">正在搜索附近的房间…</text>
<text x="92" y="1028" font-size="19" font-weight="400" fill="#4D6A80">正文  17 / 26 · Regular</text>
<text x="92" y="1076" font-size="19" font-weight="400" fill="#4D6A80">客户端沿用已捆绑 Noto Sans SC，使用正常字重。</text>
<text x="92" y="1108" font-size="19" font-weight="400" fill="#4D6A80">电视正文建议 ≥ 24（1280 × 720 逻辑画布）。</text>
<rect x="788" y="722" width="536" height="438" rx="28" fill="#FFFFFF"/>
<text x="816" y="767" font-size="26" font-weight="700" fill="#173653">04  间距与形状建议</text>
<path d="M816 788H1296" stroke="#CBDDE9" stroke-width="2"/>
<rect x="820" y="832" width="40" height="8" rx="5" fill="#2469AD"/>
<text x="825" y="875" font-size="19" font-weight="400" fill="#4D6A80">4</text>
<rect x="899" y="824" width="40" height="16" rx="5" fill="#2469AD"/>
<text x="904" y="875" font-size="19" font-weight="400" fill="#4D6A80">8</text>
<rect x="978" y="816" width="40" height="24" rx="5" fill="#2469AD"/>
<text x="983" y="875" font-size="19" font-weight="400" fill="#4D6A80">12</text>
<rect x="1057" y="808" width="40" height="32" rx="5" fill="#2469AD"/>
<text x="1062" y="875" font-size="19" font-weight="400" fill="#4D6A80">16</text>
<rect x="1136" y="792" width="40" height="48" rx="5" fill="#2469AD"/>
<text x="1141" y="875" font-size="19" font-weight="400" fill="#4D6A80">24</text>
<rect x="1215" y="776" width="40" height="64" rx="5" fill="#2469AD"/>
<text x="1220" y="875" font-size="19" font-weight="400" fill="#4D6A80">32</text>
<text x="820" y="930" font-size="20" font-weight="400" fill="#4D6A80">间距：以 4 为步进，内容分组用 16 / 24。</text>
<text x="820" y="973" font-size="20" font-weight="400" fill="#4D6A80">输入框 R12 · 按钮 R18 · 卡片 R24。</text>
<text x="820" y="1016" font-size="20" font-weight="400" fill="#4D6A80">手机按钮高 52；电视按钮高 64。</text>
<text x="820" y="1059" font-size="20" font-weight="400" fill="#4D6A80">这些数值为初稿建议，后续在 Godot 实测。</text>
<rect x="1348" y="722" width="508" height="438" rx="28" fill="#FFFFFF"/>
<text x="1376" y="767" font-size="26" font-weight="700" fill="#173653">05  随时间轻变天空</text>
<path d="M1376 788H1828" stroke="#CBDDE9" stroke-width="2"/>
<rect x="1376" y="810" width="452" height="205" rx="24" fill="url(#sky-evening)"/>
<g transform="translate(1392 823) scale(0.72)"><use href="#buddy"/>
<ellipse cx="42" cy="49" rx="3" ry="4.5" fill="#173653"/><ellipse cx="68" cy="49" rx="3" ry="4.5" fill="#173653"/><path d="M44 60 66 62Q58 80 44 60Z" fill="#F3A4C3" stroke="#173653" stroke-width="2.3" stroke-linejoin="round"/>
<ellipse cx="32" cy="59" rx="6" ry="3" fill="#F3A873" opacity=".65"/><ellipse cx="78" cy="59" rx="6" ry="3" fill="#F3A873" opacity=".65"/></g>
<text x="1496" y="860" font-size="25" font-weight="600" fill="#173653">傍晚，也一起玩</text>
<text x="1401" y="921" font-size="19" font-weight="400" fill="#173653">当地时间 · 天色渐变</text>
<rect x="1400" y="947" width="403" height="42" rx="12" fill="#FFFFFF"/>
<text x="1416" y="976" font-size="18" font-weight="400" fill="#173653">保持相近明度 / 布局 / 语义色</text>
<text x="1376" y="1060" font-size="19" font-weight="400" fill="#4D6A80">晨 / 日 / 暮 / 夜轻微变化，面板仍明亮。</text>
<text x="1376" y="1092" font-size="19" font-weight="400" fill="#4D6A80">时间变化轻微，内容面板保持可读。</text>
<rect x="64" y="1184" width="1792" height="152" rx="24" fill="#DCEFFD"/>
<text x="92" y="1227" font-size="25" font-weight="700" fill="#173653">可读性先于装饰</text>
<text x="92" y="1266" font-size="21" font-weight="400" fill="#4D6A80">正文与主要背景的对比目标 ≥ 4.5:1；焦点、图标、边界单独检查。黄色按钮使用深蓝文字。</text>
<text x="92" y="1298" font-size="21" font-weight="400" fill="#4D6A80">本色板计算值：深蓝 / 星光黄 10.01:1 · 灰蓝 / 云白 5.69:1；天空变化不改变文字与面板语义。</text>
<text x="64" y="1401" font-size="17" font-weight="400" fill="#4D6A80">星星大作战 · UI CHEAT SHEET v0.2 · 2026.11.01 · 设计初稿</text>
<text x="1550" y="1401" font-size="17" font-weight="400" fill="#4D6A80">01 / VISUAL FOUNDATIONS</text>
</g>
