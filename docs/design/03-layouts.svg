<text x="936" y="866" font-size="25" font-weight="700" fill="#133464" text-anchor="start">电视大厅：大场景、大按钮、清楚的焦点</text>
<text x="936" y="917" font-size="22" font-weight="400" fill="#506786" text-anchor="start">星星与舞台占左侧；开始 / 加入稳定放在右侧。</text>
<text x="936" y="958" font-size="22" font-weight="400" fill="#506786" text-anchor="start">蓝色背景承载气氛，白色和黄色操作层保持清楚。</text>
<text x="936" y="999" font-size="22" font-weight="400" fill="#506786" text-anchor="start">手机留安全区域，电视逻辑画布 1280 × 720。</text>
<text x="936" y="1040" font-size="22" font-weight="400" fill="#506786" text-anchor="start">图中为设计示意，房间自动搜索仍待实现。</text>
<rect x="932" y="1121" width="924" height="237" rx="32" fill="#D6E3FB"/>
<rect x="932" y="1114" width="924" height="237" rx="32" fill="white"/>
<rect x="958" y="1139" width="47" height="37" rx="12" fill="#2058E0"/>
<text x="981" y="1165" font-size="19" font-weight="700" fill="white" text-anchor="middle">12</text>
<text x="1021" y="1167" font-size="25" font-weight="700" fill="#133464" text-anchor="start">信息少，欢乐感来自形状与空间</text>
<text x="964" y="1218" font-size="21" font-weight="400" fill="#506786" text-anchor="start">首页：开始游戏 → 创建房间 / 选择游戏；加入游戏 → 搜索房间。</text>
<text x="964" y="1259" font-size="21" font-weight="400" fill="#506786" text-anchor="start">游戏内美术自由，统一状态、输入反馈、返回行为和电视焦点。</text>
<text x="964" y="1300" font-size="21" font-weight="400" fill="#506786" text-anchor="start">进入对局后收起大厅彩带，棋盘和手牌获得完整注意力。</text>
<text x="70" y="1192" font-size="25" font-weight="700" fill="#133464" text-anchor="start">手机大厅</text>
<text x="500" y="1192" font-size="25" font-weight="700" fill="#133464" text-anchor="start">加入游戏 / 房间已找到</text>
<text x="70" y="1244" font-size="21" font-weight="400" fill="#506786" text-anchor="start">立体主角 + 两个主入口。</text>
<text x="70" y="1278" font-size="21" font-weight="400" fill="#506786" text-anchor="start">昵称、设置退到边缘。</text>
<text x="500" y="1244" font-size="21" font-weight="400" fill="#506786" text-anchor="start">有结果、无结果、搜索中分开展示。</text>
<text x="500" y="1278" font-size="21" font-weight="400" fill="#506786" text-anchor="start">重试不清空已有输入。</text>
<text x="64" y="1403" font-size="18" font-weight="400" fill="#506786" text-anchor="start">星星大作战 · v0.3 星际派对 · SVG 设计提案 / 尚未应用到客户端</text>
<text x="1856" y="1403" font-size="18" font-weight="500" fill="#506786" text-anchor="end">PHONE &amp; TV</text></g></svg>
