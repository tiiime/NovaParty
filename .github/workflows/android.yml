name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed Release APK as well as Debug
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_BUILD_TOOLS_VERSION: 35.0.1
      ANDROID_PLATFORM_VERSION: '35'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "build-tools;$ANDROID_BUILD_TOOLS_VERSION" "platforms;android-$ANDROID_PLATFORM_VERSION"
      - name: Prepare Godot and export templates
        run: python3 tools/ci_android.py
      - name: Restore stable Debug signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret.')
          path = Path(os.environ['ANDROID_DEBUG_KEYSTORE'])
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Import project and run checks
        run: |
          "$GODOT" --headless --editor --path . --quit > "$RUNNER_TEMP/import.log" 2>&1
          if grep -E 'ERROR:|SCRIPT ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
          python3 tests/development_config.py
          python3 tests/android_build_config.py
          python3 tests/i18n.py
          "$GODOT" --headless --path . --script tests/run.gd
          "$GODOT" --headless --path . --script tests/ui.gd
      - name: Build Debug APK
        run: |
          python3 tools/build_android.py --output build/android/novaparty-debug.apk
          python3 tools/check_android_apk.py build/android/novaparty-debug.apk --debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaparty-debug-${{ github.run_number }}
          path: build/android/novaparty-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build signed Release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/novaparty-release.jks
          ANDROID_KEY_ALIAS: novaparty
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          if not os.environ['KEYSTORE_BASE64'] or not os.environ['ANDROID_KEYSTORE_PASSWORD']:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets first.')
          path = Path(os.environ['ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          python3 tools/build_android.py --release --output build/android/novaparty-release.apk
          python3 tools/check_android_apk.py build/android/novaparty-release.apk
      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaparty-release-${{ github.run_number }}
          path: build/android/novaparty-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/novaparty-release.jks" "$RUNNER_TEMP/android-debug.keystore"
