name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional version label for manual build (GitHub Release is published on tag pushes)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish_release: ${{ steps.meta.outputs.publish_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: meta
        name: Resolve release version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          ref_type = os.environ['REF_TYPE']
          ref_name = os.environ['REF_NAME']
          input_tag = os.environ.get('INPUT_TAG', '').strip()
          short_sha = os.environ['SHORT_SHA'][:7]

          if ref_type == 'tag':
              version = ref_name
              publish = 'true'
          elif input_tag:
              version = input_tag
              publish = 'false'
          else:
              text = Path('project.godot').read_text(encoding='utf-8')
              match = re.search(r'^config/version="([^"]+)"', text, re.M)
              base = match.group(1) if match else '0.0.0'
              version = f'v{base}-{short_sha}'
              publish = 'false'

          if not re.fullmatch(r'[A-Za-z0-9._-]+', version):
              raise SystemExit(f'Unsupported version label: {version!r}')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              out.write(f'version={version}\n')
              out.write(f'publish_release={publish}\n')
          print(f'Resolved version={version} publish_release={publish}')
          PY

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_BUILD_TOOLS_VERSION: 35.0.1
      ANDROID_PLATFORM_VERSION: '35'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.1
          log-accepted-android-sdk-licenses: false
      - name: Prepare Godot and export templates
        run: python3 tools/build/ci_android.py
      - name: Import project and run unit checks
        run: |
          "$GODOT" --headless --editor --path . --quit > "$RUNNER_TEMP/import.log" 2>&1
          if grep -E 'ERROR:|SCRIPT ERROR:' "$RUNNER_TEMP/import.log"; then exit 1; fi
          python3 tests/unit/development_config.py
          python3 tests/unit/android_build_config.py
          python3 tests/unit/i18n.py
          python3 tools/design/build_design_tokens.py --check
          python3 tools/design/build_app_icons.py --check
          set -o pipefail
          for suite in run uno uno_ui doudizhu doudizhu_ui gomoku jump_rope tabletop_ui user_profile profile_network ui bluetooth room_access; do
            "$GODOT" --headless --path . --script "tests/unit/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            if grep -E 'ERROR:|SCRIPT ERROR:' "$RUNNER_TEMP/$suite.log"; then exit 1; fi
          done
      - name: Build signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE: ${{ runner.temp }}/novaparty-release.jks
          ANDROID_KEY_ALIAS: novaparty
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_PATH: build/release/NovaParty-${{ needs.prepare.outputs.version }}-android.apk
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          if not os.environ['KEYSTORE_BASE64'] or not os.environ['ANDROID_KEYSTORE_PASSWORD']:
              raise SystemExit('Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets first.')
          path = Path(os.environ['ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          python3 tools/build/build_android.py --release --output "$APK_PATH"
          python3 tools/build/check_android_apk.py "$APK_PATH"
      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: build/release/NovaParty-${{ needs.prepare.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/novaparty-release.jks" "$RUNNER_TEMP/android-debug.keystore"

  windows:
    name: Windows EXE
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Godot and export templates
        run: python tools/build/ci_platforms.py --platform windows
      - name: Build standalone Release EXE
        run: python tools/build/build_release.py --platform windows --output "build/release/NovaParty-${{ needs.prepare.outputs.version }}-windows-x64.exe"
      - name: Upload Release EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: build/release/NovaParty-${{ needs.prepare.outputs.version }}-windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-release-windows-${{ github.run_number }}
          path: build/windows-release/*.log
          if-no-files-found: ignore
          retention-days: 7

  macos:
    name: macOS DMG
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Godot and Apple native bridge
        run: python3 tools/build/ci_platforms.py --platform macos
      - name: Configure optional Developer ID signing
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PASS" ] && [ -n "$SIGN_ID" ]; then
            KEYCHAIN="$RUNNER_TEMP/macos-signing.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 24)"
            CERT_FILE="$RUNNER_TEMP/macos-cert.p12"
            printf '%s' "$CERT_B64" | base64 --decode > "$CERT_FILE"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security import "$CERT_FILE" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            rm -f "$CERT_FILE"
            echo "MACOS_SIGN_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
            echo "Configured macOS Developer ID signing keychain."
          else
            echo "MACOS_CERTIFICATE_BASE64 not set; building ad-hoc signed universal DMG."
          fi
      - name: Build Universal Release DMG
        run: python3 tools/build/build_release.py --platform macos --output "build/release/NovaParty-${{ needs.prepare.outputs.version }}-macos-universal.dmg"
      - name: Upload Release DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: build/release/NovaParty-${{ needs.prepare.outputs.version }}-macos-universal.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/macos-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/macos-cert.p12"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-release-macos-${{ github.run_number }}
          path: build/macos-release/*.log
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS IPA
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Godot and Apple native bridges
        run: python3 tools/build/ci_platforms.py --platform ios
      - name: Configure optional iOS signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          SIGN_ID: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          if [ -n "$CERT_B64" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE_B64" ] && [ -n "$TEAM_ID" ]; then
            KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
            KEYCHAIN_PASS="$(openssl rand -hex 24)"
            CERT_FILE="$RUNNER_TEMP/ios-cert.p12"
            PROFILE_FILE="$RUNNER_TEMP/profile.mobileprovision"
            printf '%s' "$CERT_B64" | base64 --decode > "$CERT_FILE"
            printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_FILE"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
            security import "$CERT_FILE" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
            rm -f "$CERT_FILE"
            python3 - <<'PY'
          import os, plistlib, shutil, subprocess
          from pathlib import Path
          profile = Path(os.environ['RUNNER_TEMP']) / 'profile.mobileprovision'
          raw = subprocess.check_output(['security', 'cms', '-D', '-i', str(profile)])
          data = plistlib.loads(raw)
          uuid = data['UUID']
          name = data['Name']
          dest_dir = Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          dest_dir.mkdir(parents=True, exist_ok=True)
          dest = dest_dir / f'{uuid}.mobileprovision'
          shutil.copy2(profile, dest)
          profile.unlink()
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'IOS_TEAM_ID={os.environ["TEAM_ID"]}\n')
              env.write(f'IOS_PROVISIONING_PROFILE_SPECIFIER={name}\n')
              env.write(f'IOS_INSTALLED_PROFILE={dest}\n')
              if os.environ.get('EXPORT_METHOD'):
                  env.write(f'IOS_EXPORT_METHOD={os.environ["EXPORT_METHOD"]}\n')
              if os.environ.get('SIGN_ID'):
                  env.write(f'IOS_CODE_SIGN_IDENTITY={os.environ["SIGN_ID"]}\n')
          print(f'Installed provisioning profile: {name} ({uuid})')
          PY
          else
            echo "iOS signing secrets not configured; building unsigned arm64 IPA (ready for sideloading / re-signing)."
          fi
      - name: Build Release IPA
        run: python3 tools/build/build_release.py --platform ios --output "build/release/NovaParty-${{ needs.prepare.outputs.version }}-ios.ipa"
      - name: Upload Release IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ios
          path: build/release/NovaParty-${{ needs.prepare.outputs.version }}-ios.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ios-cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "${IOS_INSTALLED_PROFILE:-}"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-release-ios-${{ github.run_number }}
          path: build/ios-release/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, android, windows, macos, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release deliverables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify deliverables and generate SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for f in \
            "NovaParty-${VERSION}-android.apk" \
            "NovaParty-${VERSION}-ios.ipa" \
            "NovaParty-${VERSION}-windows-x64.exe" \
            "NovaParty-${VERSION}-macos-universal.dmg"; do
            test -s "$f"
          done
          sha256sum \
            "NovaParty-${VERSION}-android.apk" \
            "NovaParty-${VERSION}-ios.ipa" \
            "NovaParty-${VERSION}-windows-x64.exe" \
            "NovaParty-${VERSION}-macos-universal.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload combined release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: novaparty-release-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create or update GitHub Release
        if: needs.prepare.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "dist/NovaParty-${VERSION}-android.apk" \
              "dist/NovaParty-${VERSION}-ios.ipa" \
              "dist/NovaParty-${VERSION}-windows-x64.exe" \
              "dist/NovaParty-${VERSION}-macos-universal.dmg" \
              "dist/SHA256SUMS.txt" \
              --clobber \
              --repo "$REPO"
          else
            gh release create "$VERSION" \
              "dist/NovaParty-${VERSION}-android.apk" \
              "dist/NovaParty-${VERSION}-ios.ipa" \
              "dist/NovaParty-${VERSION}-windows-x64.exe" \
              "dist/NovaParty-${VERSION}-macos-universal.dmg" \
              "dist/SHA256SUMS.txt" \
              --repo "$REPO" \
              --title "NovaParty ${VERSION}" \
              --generate-notes
          fi
